name: SalonCare CRM - .NET CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Restore, Build & Test (SalonCare.Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup .NET 10.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet dependencies
        run: |
          dotnet restore "CRM V2.csproj"
          dotnet restore "SalonCare.Tests/SalonCare.Tests.csproj"

      - name: Build Web Application & Test Project
        run: |
          dotnet build "CRM V2.csproj" --configuration Release --no-restore
          dotnet build "SalonCare.Tests/SalonCare.Tests.csproj" --configuration Release --no-restore

      - name: Run Automated Unit Tests (xUnit - SalonCare.Tests)
        run: dotnet test "SalonCare.Tests/SalonCare.Tests.csproj" --configuration Release --no-build --verbosity normal
