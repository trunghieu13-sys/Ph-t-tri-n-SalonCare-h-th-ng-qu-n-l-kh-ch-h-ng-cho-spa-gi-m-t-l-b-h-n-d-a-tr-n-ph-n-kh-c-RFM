# =============================================================================
# SALONCARE CRM - DOCKER COMPOSE (ASP.NET Core MVC + SQL Server 2022)
# Khởi chạy đồng thời 2 container: saloncare-web và saloncare-db
# =============================================================================

services:
  saloncare-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saloncare-db
    restart: unless-stopped
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD:-SalonCare@2026!}
      - MSSQL_PID=Developer
    ports:
      - "14333:1433"
    volumes:
      - saloncare_sql_data:/var/opt/mssql
      - ./sql:/docker-entrypoint-initdb.d:ro
    networks:
      - saloncare-network

  saloncare-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: saloncare-web
    restart: unless-stopped
    depends_on:
      - saloncare-db
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=saloncare-db,1433;Database=CRM_V2;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SalonCare@2026!};MultipleActiveResultSets=true;TrustServerCertificate=True;
    networks:
      - saloncare-network

volumes:
  saloncare_sql_data:

networks:
  saloncare-network:
    driver: bridge
